[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[project]
name = "sst-base"
dynamic = ["version"]
description = "Common beamline classes and objects"
readme = "README.rst"
requires-python = ">=3.9"
license = {text = "BSD (3-clause)"}
authors = [
    {name = "National Institute of Standards and Technology", email = "charles.titus@nist.gov"}
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "bluesky",
    "ophyd",
    "numpy",
    "nbs-core>=0.2.0",
    "nbs-bl>=0.3.1",
]

[project.urls]
homepage = "https://github.com/NSLS-II-SST/sst-base"

[project.entry-points."nbs_gui.tabs"]
sst-gui-samples = "sst_base.qt.tabs.sampleTab:SampleTab"
sst-gui-testing = "sst_base.qt.tabs.testingTab:TestingTab"

[project.entry-points."nbs_gui.widgets"]
sst-gui-header = "sst_base.qt.widgets.header:NSLSHeader"

[project.entry-points."nbs_gui.plans"]
sst-gui-energy-flyscan = "sst_base.qt.plans.energyFlyscan:EnergyFlyscanWidget"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.feature.build.dependencies]
hatch = "*"

[tool.pixi.feature.build.tasks]
build = "hatch build"
test-release = "hatch publish -r test"

[tool.pixi.feature.test.pypi-dependencies]
sst-base = { path=".", editable = true }

[tool.pixi.environments]
build = { features = ["build"], solve-group = "default" }
test = { features = ["test"], solve-group = "default" }

[tool.black]
line-length = 115
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | blib2to3
  | tests/data
)/
'''
